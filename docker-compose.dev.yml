# Override de DESENVOLVIMENTO: sobe um MariaDB local para não tocar o banco da turma.
# Uso: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
# No .env local use DB_HOST=mariadb, DB_PORT=3306, DB_USER=oficina, DB_PASSWORD=oficina_dev, DB_NAME=oficinaos.
services:
  mariadb:
    image: mariadb:11
    mem_limit: 1g
    environment:
      MARIADB_ROOT_PASSWORD: root_dev
      MARIADB_DATABASE: oficinaos
      MARIADB_USER: oficina
      MARIADB_PASSWORD: oficina_dev
    ports:
      - "127.0.0.1:3398:3306"   # acesso do host (alembic, mysqldump)
    volumes:
      - mariadb-dev-data:/var/lib/mysql
    networks:
      - oficinaos-net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  app:
    depends_on:
      mariadb:
        condition: service_healthy
  auth-service:
    depends_on:
      mariadb:
        condition: service_healthy
  payment-service:
    depends_on:
      mariadb:
        condition: service_healthy

  # Portas e subnet próprias para conviver com outras stacks na mesma máquina.
  prometheus:
    ports: !override
      - "127.0.0.1:9092:9090"
  grafana:
    ports: !override
      - "127.0.0.1:3012:3000"

networks:
  oficinaos-net:
    ipam:
      config: !override
        - subnet: 10.211.0.0/24

volumes:
  mariadb-dev-data:
