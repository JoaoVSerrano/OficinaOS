services:
  # ─────────────────────────────────────────────────────────────────────────
  # Redis — banco de dados do log-service (Redis Streams) e cache do payment
  # ─────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - tomhanks-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 3s
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────
  # Microsserviço de log e auditoria — Persiste em Redis Streams
  # ─────────────────────────────────────────────────────────────────────────
  log-service:
    build:
      context: .
      dockerfile: Dockerfile.log
    environment:
      REDIS_URL: redis://redis:6379/0
      # Segredo obrigatório — defina na seção *Environment* da stack no Portainer
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?defina INTERNAL_TOKEN nas variáveis da stack}
      LOG_PORT: 4000
      MAX_LOG_ENTRIES: 10000
    depends_on:
      - redis
    networks:
      - tomhanks-net
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:4000/health\")' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────
  # MinIO — Object Storage para fotos de perfil (Atividade 6)
  # ─────────────────────────────────────────────────────────────────────────
  minio:
    image: cgr.dev/chainguard/minio:latest
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      # Segredos obrigatórios — defina na seção *Environment* da stack no Portainer
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?defina MINIO_ROOT_USER nas variáveis da stack}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD nas variáveis da stack}
    volumes:
      - minio-data:/data
    expose:
      - "9000"
      - "9001"
    networks:
      - tomhanks-net
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────
  # Microsserviço de autenticação
  # ─────────────────────────────────────────────────────────────────────────
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.auth
    environment:
      # Segredos obrigatórios — defina na seção *Environment* da stack no Portainer
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?defina AUTH_SECRET_KEY nas variáveis da stack}
      AUTH_PORT: 3000
      AUTH_ADMIN_NAME: ${AUTH_ADMIN_NAME:-Administrador}
      AUTH_ADMIN_EMAIL: ${AUTH_ADMIN_EMAIL:-}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD:-}
      # Banco remoto — obrigatório, sem fallback
      DB_HOST: ${DB_HOST:?defina DB_HOST nas variáveis da stack}
      DB_PORT: ${DB_PORT:?defina DB_PORT nas variáveis da stack}
      DB_USER: ${DB_USER:?defina DB_USER nas variáveis da stack}
      DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD nas variáveis da stack}
      DB_NAME: ${DB_NAME:?defina DB_NAME nas variáveis da stack}
      # MinIO — obrigatório
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?defina MINIO_ACCESS_KEY nas variáveis da stack}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?defina MINIO_SECRET_KEY nas variáveis da stack}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-tomhanks-avatars}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000/tomhanks-avatars}
      # SMTP — opcional (sem SMTP, recuperação de senha não envia e-mail)
      SMTP_HOST: ${SMTP_HOST:-sandbox.smtp.mailtrap.io}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_ENCRYPTION: ${SMTP_ENCRYPTION:-starttls}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@tomhanks.local}
      PASSWORD_RESET_EXPOSE_LINK: ${PASSWORD_RESET_EXPOSE_LINK:-0}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?defina INTERNAL_TOKEN nas variáveis da stack}
      LOG_SERVICE_URL: http://log-service:4000
      # Google OAuth — opcional (sem Google OAuth, botão não aparece)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8080/api/auth/google/callback}
    depends_on:
      - log-service
      - minio
    networks:
      - tomhanks-net
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:3000/health\")' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────
  # Microsserviço de pagamentos — Stripe (Assinaturas Premium)
  # ─────────────────────────────────────────────────────────────────────────
  payment-service:
    build:
      context: .
      dockerfile: Dockerfile.payment
    environment:
      PAYMENT_PORT: 5000
      # Banco remoto — obrigatório, sem fallback
      DB_HOST: ${DB_HOST:?defina DB_HOST nas variáveis da stack}
      DB_PORT: ${DB_PORT:?defina DB_PORT nas variáveis da stack}
      DB_USER: ${DB_USER:?defina DB_USER nas variáveis da stack}
      DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD nas variáveis da stack}
      DB_NAME: ${DB_NAME:?defina DB_NAME nas variáveis da stack}
      REDIS_URL: redis://redis:6379/0
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?defina INTERNAL_TOKEN nas variáveis da stack}
      LOG_SERVICE_URL: http://log-service:4000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      # Stripe — obrigatório para pagamentos (use chaves de teste: sk_test_... / pk_test_...)
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:-http://localhost:8080/?payment=success}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:-http://localhost:8080/?payment=cancel}
      # Cache de entitlement — padrão 5 minutos
      ENTITLEMENT_CACHE_TTL: ${ENTITLEMENT_CACHE_TTL:-300}
    depends_on:
      - redis
      - log-service
    networks:
      - tomhanks-net
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:5000/health\")' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────
  # Catálogo de filmes — único ponto de entrada público
  # ─────────────────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # Segredos obrigatórios — defina na seção *Environment* da stack no Portainer
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:?defina FLASK_SECRET_KEY nas variáveis da stack}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      TMDB_LANGUAGE: ${TMDB_LANGUAGE:-pt-BR}
      # Banco remoto — obrigatório, sem fallback
      DB_HOST: ${DB_HOST:?defina DB_HOST nas variáveis da stack}
      DB_PORT: ${DB_PORT:?defina DB_PORT nas variáveis da stack}
      DB_USER: ${DB_USER:?defina DB_USER nas variáveis da stack}
      DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD nas variáveis da stack}
      DB_NAME: ${DB_NAME:?defina DB_NAME nas variáveis da stack}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-Lax}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-0}
      PORT: ${PORT:-8080}
      # MinIO — obrigatório
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?defina MINIO_ACCESS_KEY nas variáveis da stack}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?defina MINIO_SECRET_KEY nas variáveis da stack}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-tomhanks-avatars}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000/tomhanks-avatars}
      AUTH_SERVICE_URL: http://auth-service:3000
      PAYMENT_SERVICE_URL: http://payment-service:5000
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?defina INTERNAL_TOKEN nas variáveis da stack}
      LOG_SERVICE_URL: http://log-service:4000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      # Stripe — publishable key para o frontend iniciar checkout
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    depends_on:
      - auth-service
      - payment-service
      - log-service
      - minio
      - redis
    networks:
      - tomhanks-net
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8080/api/health\")' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────
  # Prometheus — Coleta e armazenamento de métricas (Atividade Observabilidade)
  # ─────────────────────────────────────────────────────────────────────────
  prometheus:
    build:
      context: .
      dockerfile: Dockerfile.prometheus
    ports:
      - "9091:9090"
    networks:
      - tomhanks-net
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────
  # Grafana — Visualização e dashboards de observabilidade
  # ─────────────────────────────────────────────────────────────────────────
  grafana:
    build:
      context: .
      dockerfile: Dockerfile.grafana
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    networks:
      - tomhanks-net
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

networks:
  tomhanks-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 10.201.0.0/24

volumes:
  redis-data:
  minio-data:
