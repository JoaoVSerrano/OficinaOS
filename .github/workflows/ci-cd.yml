name: CI/CD Pipeline — Catálogo Tom Hanks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: 🧪 CI — Execução de Testes Automatizados
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DB_HOST: localhost
      DB_PORT: "3306"
      DB_USER: test_user
      DB_PASSWORD: test_password
      DB_NAME: test_db
      FLASK_SECRET_KEY: test-flask-secret-key-ci-environment
      AUTH_SECRET_KEY: test-auth-secret-key-ci-environment
      INTERNAL_TOKEN: test-internal-token-ci-environment
      MINIO_ACCESS_KEY: test-minio-key
      MINIO_SECRET_KEY: test-minio-secret
      REDIS_URL: redis://localhost:6379/0
      # Stripe — chaves de teste fictícias para os testes de webhook
      STRIPE_SECRET_KEY: sk_test_ci_fake_key_for_testing_only
      STRIPE_WEBHOOK_SECRET: whsec_ci_fake_webhook_secret_for_testing_only
      STRIPE_PRICE_ID: price_ci_fake_price_id
      STRIPE_PUBLISHABLE_KEY: pk_test_ci_fake_publishable_key
      # Google OAuth — valores fictícios para CI
      GOOGLE_CLIENT_ID: fake-google-client-id.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: fake-google-client-secret

    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 📦 Instalar dependências Python de todos os serviços
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r auth_service/requirements.txt -r log_service/requirements.txt -r payment_service/requirements.txt
          pip install pytest

      - name: 🧪 Executar suíte de testes pytest
        run: |
          pytest tests/ -v

  build-and-push:
    name: 📦 CD — Build & Publish no GitHub Container Registry (GHCR)
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4

      - name: 🐳 Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Autenticar no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # 1. Build & Push: App Principal (Tom Hanks Catalog Gateway)
      # -----------------------------------------------------------------------
      - name: 🏷️ Extrair tags e rótulos para oficinaos-app
        id: meta-app
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/oficinaos-app
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-

      - name: 🚀 Build & Push oficinaos-app
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta-app.outputs.tags }}
          labels: ${{ steps.meta-app.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -----------------------------------------------------------------------
      # 2. Build & Push: Auth Service
      # -----------------------------------------------------------------------
      - name: 🏷️ Extrair tags e rótulos para oficinaos-auth-service
        id: meta-auth
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/oficinaos-auth-service
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-

      - name: 🚀 Build & Push oficinaos-auth-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.auth
          push: true
          tags: ${{ steps.meta-auth.outputs.tags }}
          labels: ${{ steps.meta-auth.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -----------------------------------------------------------------------
      # 3. Build & Push: Log Service (Auditoria / Redis Streams)
      # -----------------------------------------------------------------------
      - name: 🏷️ Extrair tags e rótulos para oficinaos-log-service
        id: meta-log
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/oficinaos-log-service
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-

      - name: 🚀 Build & Push oficinaos-log-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.log
          push: true
          tags: ${{ steps.meta-log.outputs.tags }}
          labels: ${{ steps.meta-log.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -----------------------------------------------------------------------
      # 4. Build & Push: Payment Service (Assinaturas Stripe)
      # -----------------------------------------------------------------------
      - name: 🏷️ Extrair tags e rótulos para oficinaos-payment-service
        id: meta-payment
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/oficinaos-payment-service
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-

      - name: 🚀 Build & Push oficinaos-payment-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.payment
          push: true
          tags: ${{ steps.meta-payment.outputs.tags }}
          labels: ${{ steps.meta-payment.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 🚀 Deploy — Atualização Contínua no Portainer & Smoke Test
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15

    steps:
      - name: 🌐 Disparar Webhook do Portainer
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          if [ -z "$PORTAINER_WEBHOOK_URL" ]; then
            echo "::warning::Secret PORTAINER_WEBHOOK_URL não configurado no GitHub. O deploy automático via Portainer foi ignorado."
            echo "Para habilitar, crie o secret PORTAINER_WEBHOOK_URL com a URL do webhook da stack no Portainer."
            exit 0
          fi

          echo "Disparando webhook de atualização da stack no Portainer..."
          curl --fail --retry 3 --retry-delay 5 -X POST "$PORTAINER_WEBHOOK_URL"
          echo "✅ Webhook do Portainer acionado com sucesso!"

      - name: 🩺 Smoke Test — Validação de Saúde da Aplicação (/health)
        env:
          DEPLOY_HEALTH_URL: ${{ secrets.DEPLOY_HEALTH_URL || vars.DEPLOY_HEALTH_URL }}
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          if [ -z "$PORTAINER_WEBHOOK_URL" ]; then
            echo "Deploy ignorado por ausência de webhook; smoke test não será executado."
            exit 0
          fi

          if [ -z "$DEPLOY_HEALTH_URL" ]; then
            echo "::warning::URL de healthcheck (DEPLOY_HEALTH_URL) não configurada como secret ou variável. Smoke test ignorado."
            exit 0
          fi

          echo "Iniciando smoke test em: $DEPLOY_HEALTH_URL"
          echo "Aguardando o Portainer concluir o deploy da stack..."

          MAX_ATTEMPTS=30
          SLEEP_SECONDS=10
          ATTEMPT=1
          SUCCESS=0

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Tentativa $ATTEMPT/$MAX_ATTEMPTS: consultando $DEPLOY_HEALTH_URL..."
            HTTP_CODE=$(curl -s -o /tmp/health_response.json -w "%{http_code}" "$DEPLOY_HEALTH_URL" || echo "000")

            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Resposta HTTP 200 recebida!"
              cat /tmp/health_response.json || true
              echo ""
              SUCCESS=1
              break
            else
              echo "  Status retornado: $HTTP_CODE. Aguardando ${SLEEP_SECONDS}s..."
              sleep $SLEEP_SECONDS
            fi
            ATTEMPT=$((ATTEMPT + 1))
          done

          if [ $SUCCESS -ne 1 ]; then
            echo "❌ ERRO: Aplicação não atingiu o estado saudável dentro do tempo limite (${MAX_ATTEMPTS}x${SLEEP_SECONDS}s)."
            exit 1
          fi

          echo "🎉 Smoke test concluído com sucesso! Deploy verificado em produção."
